services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: bedoux
      POSTGRES_PASSWORD: bedoux
      POSTGRES_DB: bedoux
    ports:
      - "5432:5432"
    volumes:
      - bedoux-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bedoux"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      BEDOUX_DATABASE_URL: postgresql+psycopg://bedoux:bedoux@postgres:5432/bedoux
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
    environment:
      # Compose DNS name for the api service + its in-container port. nginx.conf.template
      # proxies /api/ here — this whole layer is replaced by Kubernetes Ingress in P3+.
      API_UPSTREAM: api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bedoux-postgres-data:
