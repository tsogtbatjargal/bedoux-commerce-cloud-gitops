name: Deploy learning session

on:
  workflow_dispatch:
    inputs:
      seed_catalog:
        description: Bootstrap the idempotent demo catalog for a fresh session database.
        required: true
        default: false
        type: boolean
      rollback_drill:
        description: Deliberately crash the signed web image and verify Helm atomic rollback.
        required: true
        default: false
        type: boolean
      use_rds:
        description: Deploy against the P7 RDS database profile.
        required: true
        default: false
        type: boolean
      use_secrets_manager:
        description: Resolve the P7.3 database URL directly from Secrets Manager through the API IRSA role.
        required: true
        default: false
        type: boolean
      use_s3_images:
        description: Deploy with P7.2's private S3 image adapter and pre-created API IRSA ServiceAccount.
        required: true
        default: false
        type: boolean
      use_custom_domain:
        description: Enable P12.2 HTTPS for bedoux.ca/www through ACM certificate discovery.
        required: true
        default: false
        type: boolean
      canary_rollout:
        description: Stage the signed candidate at 10%, gate it, then promote and clean up.
        required: true
        default: false
        type: boolean
      canary_regression_drill:
        description: Inject canary-only HTTP errors; require gate-blocked automatic rollback.
        required: true
        default: false
        type: boolean

# The role trust policy admits only this repository's main branch. Keep this workflow
# manually dispatched so a live AWS session is an intentional, time-bounded operation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: bedoux-learning-session-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  EKS_CLUSTER: bedoux
  KUBERNETES_NAMESPACE: bedoux
  COSIGN_CERTIFICATE_IDENTITY: https://github.com/bedoux-tech/bedoux-commerce-cloud/.github/workflows/deploy-learning.yml@refs/heads/main
  COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  deploy:
    name: Build, deploy, and smoke-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Inspect non-sensitive GitHub OIDC claims
        # This is deliberately before AWS authentication. It emits only issuer,
        # audience, and subject — never the JWT, request token, or any credential.
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          oidc_token="$(python -c 'import json, sys; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")"
          export OIDC_TOKEN="$oidc_token"
          python - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for claim in ("iss", "aud", "sub"):
              print(f"{claim}: {claims[claim]}")
          PY
          unset OIDC_TOKEN oidc_token oidc_response

      - name: Configure short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover and authenticate to the learning ECR registry
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$account_id"
          registry="$account_id.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$registry"

      - name: Build and push immutable application images
        id: images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          build_and_push_if_missing() {
            local component="$1"
            local image="$ECR_REGISTRY/bedoux-$component:${GITHUB_SHA}"

            if aws ecr describe-images --repository-name "bedoux-$component" \
              --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
              printf 'Reusing immutable image %s for this commit.\n' "$component"
              return
            fi

            docker build \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image" "apps/$component"
            docker push "$image"
          }

          build_and_push_if_missing api
          build_and_push_if_missing web

          for component in api web; do
            digest="$(aws ecr describe-images --repository-name "bedoux-$component" \
              --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_digest=%s\n' "$component" "$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Prepare SBOM output directory
        run: mkdir -p sbom

      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ecr.outputs.registry }}/bedoux-api@${{ steps.images.outputs.api_digest }}
          format: spdx-json
          output-file: sbom/bedoux-api.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ecr.outputs.registry }}/bedoux-web@${{ steps.images.outputs.web_digest }}
          format: spdx-json
          output-file: sbom/bedoux-web.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Upload deployment SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bedoux-deployment-sboms-${{ github.sha }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Sign immutable image digests with GitHub OIDC
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_IMAGE_DIGEST: ${{ steps.images.outputs.api_digest }}
          WEB_IMAGE_DIGEST: ${{ steps.images.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          verify_args=(
            "--certificate-identity=$COSIGN_CERTIFICATE_IDENTITY"
            "--certificate-oidc-issuer=$COSIGN_CERTIFICATE_OIDC_ISSUER"
          )
          for image_reference in \
            "$ECR_REGISTRY/bedoux-api@$API_IMAGE_DIGEST" \
            "$ECR_REGISTRY/bedoux-web@$WEB_IMAGE_DIGEST"; do
            if cosign verify "$image_reference" "${verify_args[@]}" >/dev/null 2>&1; then
              printf '%s\n' 'Reusing an existing signature from this main-branch workflow.'
            else
              cosign sign --yes "$image_reference" >/dev/null
              printf '%s\n' 'Created a keyless signature for an immutable image digest.'
            fi
          done

      - name: Configure namespace-scoped EKS access
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER" --alias "$EKS_CLUSTER"

      - name: Capture the pre-drill web image
        id: pre_drill_release
        if: ${{ inputs.rollback_drill }}
        shell: bash
        run: |
          set -euo pipefail
          previous_web_image="$(kubectl -n "$KUBERNETES_NAMESPACE" get deployment/web \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          test -n "$previous_web_image"
          echo "::add-mask::$previous_web_image"
          echo "web_image=$previous_web_image" >> "$GITHUB_OUTPUT"

      - name: Capture the immutable stable release for canary
        id: stable_release
        if: ${{ inputs.canary_rollout || inputs.canary_regression_drill }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(kubectl auth can-i get targetgroupbindings.elbv2.k8s.aws \
            --namespace "$KUBERNETES_NAMESPACE")" = "yes"
          test "$(kubectl auth can-i list targetgroupbindings.elbv2.k8s.aws \
            --namespace "$KUBERNETES_NAMESPACE")" = "yes"
          helm -n "$KUBERNETES_NAMESPACE" status bedoux >/dev/null
          api_image="$(kubectl -n "$KUBERNETES_NAMESPACE" get deployment/api \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          web_image="$(kubectl -n "$KUBERNETES_NAMESPACE" get deployment/web \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          [[ "$api_image" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$web_image" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "::add-mask::$api_image"
          echo "::add-mask::$web_image"
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"

      - name: Deploy the Helm release
        id: helm_deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_IMAGE_DIGEST: ${{ steps.images.outputs.api_digest }}
          WEB_IMAGE_DIGEST: ${{ steps.images.outputs.web_digest }}
          SEED_CATALOG: ${{ inputs.seed_catalog }}
          ROLLBACK_DRILL: ${{ inputs.rollback_drill }}
          USE_RDS: ${{ inputs.use_rds }}
          USE_SECRETS_MANAGER: ${{ inputs.use_secrets_manager }}
          USE_S3_IMAGES: ${{ inputs.use_s3_images }}
          USE_CUSTOM_DOMAIN: ${{ inputs.use_custom_domain }}
          CANARY_ROLLOUT: ${{ inputs.canary_rollout }}
          CANARY_REGRESSION_DRILL: ${{ inputs.canary_regression_drill }}
          STABLE_API_IMAGE: ${{ steps.stable_release.outputs.api_image }}
          STABLE_WEB_IMAGE: ${{ steps.stable_release.outputs.web_image }}
        shell: bash
        run: |
          set -euo pipefail
          verify_args=(
            "--certificate-identity=$COSIGN_CERTIFICATE_IDENTITY"
            "--certificate-oidc-issuer=$COSIGN_CERTIFICATE_OIDC_ISSUER"
          )
          for image_reference in \
            "$ECR_REGISTRY/bedoux-api@$API_IMAGE_DIGEST" \
            "$ECR_REGISTRY/bedoux-web@$WEB_IMAGE_DIGEST"; do
            cosign verify "$image_reference" "${verify_args[@]}" >/dev/null
          done
          printf '%s\n' 'Verified both main-branch image signatures before Helm rollout.'

          # M3: scripts/lib/deploy_profile.py resolves the 8 dispatch booleans into one
          # named deployment profile -- mode, release timeout, ordered Helm values files,
          # extra --set args, and the live-cluster preflight facts this step must check.
          # It is pure (no AWS/Kubernetes access) and checked exhaustively over all 256
          # combinations in scripts/test_deploy_profile.py against an independently
          # written reference. This replaces 8 refusal checks interleaved with values-file
          # construction; the stride-2 loop that used to re-parse profile_files backwards
          # for the canary path is gone, because values_files is now a first-class list
          # both paths consume directly.
          resolve_args=(
            --seed-catalog "$SEED_CATALOG"
            --rollback-drill "$ROLLBACK_DRILL"
            --use-rds "$USE_RDS"
            --use-secrets-manager "$USE_SECRETS_MANAGER"
            --use-s3-images "$USE_S3_IMAGES"
            --use-custom-domain "$USE_CUSTOM_DOMAIN"
            --canary-rollout "$CANARY_ROLLOUT"
            --canary-regression-drill "$CANARY_REGRESSION_DRILL"
          )
          deploy_mode="$(python scripts/lib/deploy_profile.py mode "${resolve_args[@]}")"
          release_timeout="$(python scripts/lib/deploy_profile.py release-timeout "${resolve_args[@]}")"
          mapfile -t values_files < <(python scripts/lib/deploy_profile.py values-files "${resolve_args[@]}")
          mapfile -t helm_extra_args < <(python scripts/lib/deploy_profile.py helm-extra-args "${resolve_args[@]}")
          mapfile -t preflight_checks < <(python scripts/lib/deploy_profile.py preflight-checks "${resolve_args[@]}")

          # Execute the resolved preflight facts against the live cluster.
          # deploy_profile.py can only say what must be true; only this step, with
          # cluster access, can check it.
          for check in "${preflight_checks[@]}"; do
            read -r kind resource name <<<"$check"
            case "$kind" in
              exists)
                kubectl -n "$KUBERNETES_NAMESPACE" get "$resource" "$name" >/dev/null
                ;;
              absent)
                if kubectl -n "$KUBERNETES_NAMESPACE" get "$resource" "$name" >/dev/null 2>&1; then
                  printf 'REFUSING: %s/%s must not exist for this deployment profile.\n' \
                    "$resource" "$name" >&2
                  exit 1
                fi
                ;;
            esac
          done

          profile_files=()
          for values_file in "${values_files[@]}"; do
            profile_files+=(-f "$values_file")
          done

          if [[ "$deploy_mode" == "canary" ]]; then
            rollout_args=(
              --context "$EKS_CLUSTER"
              --namespace "$KUBERNETES_NAMESPACE"
              --stable-api-image "$STABLE_API_IMAGE"
              --stable-web-image "$STABLE_WEB_IMAGE"
              --candidate-api-image "$ECR_REGISTRY/bedoux-api@$API_IMAGE_DIGEST"
              --candidate-web-image "$ECR_REGISTRY/bedoux-web@$WEB_IMAGE_DIGEST"
              --aws-region "$AWS_REGION"
              --weight 10
              --attempts 20
              --public-attempts 100
              --max-errors 0
              --drain-seconds 45
              --helm-set storageClass.create=false
            )
            if [[ "$CANARY_REGRESSION_DRILL" == "true" ]]; then
              rollout_args+=(--regression-mode http-error)
            fi
            for values_file in "${values_files[@]}"; do
              rollout_args+=(--values "$values_file")
            done
            scripts/p13-canary-rollout.sh "${rollout_args[@]}" --execute
          else
            helm_args=(
              upgrade --install bedoux charts/bedoux
              --namespace "$KUBERNETES_NAMESPACE"
              --reset-values --wait --wait-for-jobs --timeout "$release_timeout" --atomic
              "${profile_files[@]}"
              # StorageClass is cluster-scoped. The session operator bootstraps
              # gp3 before dispatch so this namespace-only CI role never needs
              # cluster-wide Kubernetes permissions.
              --set storageClass.create=false
              --set-string "api.image.repository=$ECR_REGISTRY/bedoux-api"
              --set-string "api.image.tag=$GITHUB_SHA"
              --set-string "api.image.digest=$API_IMAGE_DIGEST"
              --set-string "web.image.repository=$ECR_REGISTRY/bedoux-web"
              --set-string "web.image.tag=$GITHUB_SHA"
              --set-string "web.image.digest=$WEB_IMAGE_DIGEST"
              "${helm_extra_args[@]}"
            )
            helm "${helm_args[@]}"
          fi
          kubectl -n "$KUBERNETES_NAMESPACE" rollout status deployment/api --timeout=5m
          kubectl -n "$KUBERNETES_NAMESPACE" rollout status deployment/web --timeout=5m

      - name: Verify atomic rollback after the controlled failure
        if: ${{ failure() && inputs.rollback_drill && steps.helm_deploy.outcome == 'failure' }}
        env:
          EXPECTED_WEB_IMAGE: ${{ steps.pre_drill_release.outputs.web_image }}
        shell: bash
        run: |
          set -euo pipefail
          helm -n "$KUBERNETES_NAMESPACE" history bedoux
          helm -n "$KUBERNETES_NAMESPACE" status bedoux
          kubectl -n "$KUBERNETES_NAMESPACE" get deployments,pods

          actual_web_image="$(kubectl -n "$KUBERNETES_NAMESPACE" get deployment/web \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          test -n "$EXPECTED_WEB_IMAGE"
          test "$actual_web_image" = "$EXPECTED_WEB_IMAGE"

          hostname="$(kubectl -n "$KUBERNETES_NAMESPACE" get ingress bedoux \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          test -n "$hostname"
          curl --fail --silent --show-error --connect-timeout 10 \
            "http://$hostname/api/health" > /tmp/bedoux-rollback-health.json
          python -c 'import json; response = json.load(open("/tmp/bedoux-rollback-health.json")); assert response == {"status": "ok", "orders_enabled": False}, response'
          printf '%s\n' 'Atomic rollback restored the prior web image and public health endpoint.'

      - name: Smoke-test the public ALB route
        env:
          USE_S3_IMAGES: ${{ inputs.use_s3_images }}
          USE_CUSTOM_DOMAIN: ${{ inputs.use_custom_domain }}
        shell: bash
        run: |
          set -euo pipefail
          hostname=""
          for _ in $(seq 1 30); do
            hostname="$(kubectl -n "$KUBERNETES_NAMESPACE" get ingress bedoux -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [[ -n "$hostname" ]]; then
              break
            fi
            sleep 10
          done
          test -n "$hostname"
          echo "::add-mask::$hostname"

          curl_args=(--fail --silent --show-error --connect-timeout 10 --max-time 30)
          if [[ "$USE_CUSTOM_DOMAIN" == "true" ]]; then
            # Route 53 aliases are deliberately added only after this workflow
            # proves the listener. Connect to the discovered ALB while keeping
            # bedoux.ca as the TLS SNI and HTTP host.
            base_url="https://bedoux.ca"
            curl_args+=(--connect-to "bedoux.ca:443:$hostname:443")
          else
            base_url="http://$hostname"
          fi
          for _ in $(seq 1 24); do
            if curl "${curl_args[@]}" "$base_url/api/health" > /tmp/bedoux-health.json; then
              break
            fi
            sleep 10
          done
          python -c 'import json; response = json.load(open("/tmp/bedoux-health.json")); assert response == {"status": "ok", "orders_enabled": False}, response'
          curl "${curl_args[@]}" "$base_url/api/products?limit=1" > /tmp/bedoux-products.json
          python -c 'import json; products = json.load(open("/tmp/bedoux-products.json")); assert len(products) >= 1, products'
          if [[ "$USE_S3_IMAGES" == "true" ]]; then
            image_url="$(python -c 'import json; print(json.load(open("/tmp/bedoux-products.json"))[0]["image_url"])')"
            echo "::add-mask::$image_url"
            case "$image_url" in
              https://*) ;;
              *) echo "expected an S3 presigned HTTPS product image URL" >&2; exit 1 ;;
            esac
            curl --fail --silent --show-error --connect-timeout 10 "$image_url" -o /tmp/bedoux-product-image.svg
            test -s /tmp/bedoux-product-image.svg
          fi
