name: PR validation

on:
  pull_request:
    branches: [main]

# This workflow proves pull requests without cloud credentials. Only P6.4's
# separate deployment workflow will request an OIDC token.
permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bedoux
          POSTGRES_PASSWORD: bedoux
          POSTGRES_DB: bedoux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bedoux"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BEDOUX_DATABASE_URL: postgresql+psycopg://bedoux:bedoux@localhost:5432/bedoux
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Migrate test database and run tests
        run: alembic upgrade head && pytest -v

  web:
    name: Web lint, test, and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint, test, and build
        run: npm run lint && npm test && npm run build

  infrastructure:
    name: Terraform and Helm validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Check Terraform format and configuration
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate -var=skip_aws_credentials_validation=true
          terraform -chdir=infra/terraform validate -var=skip_aws_credentials_validation=true -var-file=terraform.tfvars.p11-ha.example
      - name: Lint and render all Helm profiles
        run: |
          set -euo pipefail
          helm lint charts/bedoux
          base_rendered="$(helm template bedoux charts/bedoux)"
          test "$(grep -c '^      terminationGracePeriodSeconds: 30$' <<< "$base_rendered")" -eq 2
          test "$(grep -c '^          lifecycle:$' <<< "$base_rendered")" -eq 0
          helm template bedoux charts/bedoux -f charts/bedoux/values-aws.yaml >/dev/null
          helm template bedoux charts/bedoux -f charts/bedoux/values-kind-ha.yaml >/dev/null
          helm template bedoux charts/bedoux -f charts/bedoux/values-aws.yaml -f charts/bedoux/values-aws-ha.yaml >/dev/null
          helm template bedoux charts/bedoux -f charts/bedoux/values-aws.yaml -f charts/bedoux/values-aws-rds.yaml >/dev/null
          kind_ha_rendered="$(helm template bedoux charts/bedoux -f charts/bedoux/values-kind-ha.yaml)"
          test "$(grep -c '^kind: PodDisruptionBudget$' <<< "$kind_ha_rendered")" -eq 2
          test "$(grep -c '^      topologySpreadConstraints:$' <<< "$kind_ha_rendered")" -eq 2
          aws_ha_rendered="$(helm template bedoux charts/bedoux -f charts/bedoux/values-aws.yaml -f charts/bedoux/values-aws-ha.yaml)"
          test "$(grep -c '^kind: PodDisruptionBudget$' <<< "$aws_ha_rendered")" -eq 2
          test "$(grep -c '^      topologySpreadConstraints:$' <<< "$aws_ha_rendered")" -eq 2
          test "$(grep -c '^          whenUnsatisfiable: ScheduleAnyway$' <<< "$aws_ha_rendered")" -eq 2
          test "$(grep -c '^      terminationGracePeriodSeconds: 60$' <<< "$aws_ha_rendered")" -eq 2
          test "$(grep -c '^          lifecycle:$' <<< "$aws_ha_rendered")" -eq 2
          test "$(grep -c '^                  - \"sleep 45\"$' <<< "$aws_ha_rendered")" -eq 2
          grep -q 'alb.ingress.kubernetes.io/target-group-attributes: "deregistration_delay.timeout_seconds=30"' <<< "$aws_ha_rendered"
          digest="sha256:$(printf 'a%.0s' {1..64})"
          rendered="$(helm template bedoux charts/bedoux \
            --set-string "api.image.digest=$digest" \
            --set-string "web.image.digest=$digest")"
          grep -q "localhost/bedoux-api@$digest" <<< "$rendered"
          grep -q "localhost/bedoux-web@$digest" <<< "$rendered"
          if grep -q 'localhost/bedoux-api:p3\|localhost/bedoux-web:p3' <<< "$rendered"; then
            echo 'digest-pinned render unexpectedly retained a mutable application tag' >&2
            exit 1
          fi

  container-security:
    name: Container build and scan
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2.8.3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Build immutable candidate images
        id: candidate-images
        shell: bash
        run: |
          set -euo pipefail
          for component in api web; do
            local_image="bedoux-$component:pr-${GITHUB_SHA}"
            registry_image="localhost:5000/bedoux-$component:pr-${GITHUB_SHA}"
            docker build --tag "$local_image" --tag "$registry_image" "apps/$component"
            docker push "$registry_image" >/dev/null
            image_reference="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$registry_image")"
            test -n "$image_reference"
            printf '%s_reference=%s\n' "$component" "$image_reference" >> "$GITHUB_OUTPUT"
          done
      - name: Scan images for fixable high and critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock docker.io/aquasec/trivy:0.72.0 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL bedoux-api:pr-${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock docker.io/aquasec/trivy:0.72.0 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL bedoux-web:pr-${{ github.sha }}
      - name: Prepare SBOM output directory
        run: mkdir -p sbom
      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: bedoux-api:pr-${{ github.sha }}
          format: spdx-json
          output-file: sbom/bedoux-api.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: bedoux-web:pr-${{ github.sha }}
          format: spdx-json
          output-file: sbom/bedoux-web.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Upload candidate SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bedoux-candidate-sboms-${{ github.sha }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Sign and verify candidate images in the ephemeral registry
        env:
          API_IMAGE_REFERENCE: ${{ steps.candidate-images.outputs.api_reference }}
          WEB_IMAGE_REFERENCE: ${{ steps.candidate-images.outputs.web_reference }}
        shell: bash
        run: |
          set -euo pipefail
          key_prefix="$RUNNER_TEMP/bedoux-ci-cosign"
          export COSIGN_PASSWORD="$(openssl rand -hex 32)"
          trap 'rm -f "$key_prefix.key" "$key_prefix.pub"; unset COSIGN_PASSWORD' EXIT
          cosign generate-key-pair --output-key-prefix "$key_prefix" >/dev/null

          for image_reference in "$API_IMAGE_REFERENCE" "$WEB_IMAGE_REFERENCE"; do
            cosign sign --yes --allow-insecure-registry --key "$key_prefix.key" "$image_reference" >/dev/null
            cosign verify --allow-insecure-registry --key "$key_prefix.pub" "$image_reference" >/dev/null
          done
          printf '%s\n' 'Cosign signed and verified both immutable candidate image digests.'
