[project]
name = "bedoux-api"
version = "0.1.0"
description = "Bedoux Commerce Cloud — products and orders API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn[standard]>=0.38,<0.39",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<3.3",
  "alembic>=1.14,<1.15",
  "pydantic-settings>=2.7,<2.8",
  "boto3>=1.35,<1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<0.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
