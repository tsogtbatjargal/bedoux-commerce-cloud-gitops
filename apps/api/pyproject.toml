[project]
name = "bedoux-api"
version = "0.1.0"
description = "Bedoux Commerce Cloud — products and orders API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<0.119",
  "uvicorn[standard]>=0.38,<0.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<0.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
