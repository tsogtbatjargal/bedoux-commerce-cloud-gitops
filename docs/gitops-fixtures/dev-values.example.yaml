# Legacy Helm-hook migration (ADR 0005) stays OFF under the GitOps profile per Gate 2;
# the new sync-wave-ordered Job in gitops-migration-job.example.yaml is not part of
# this chart yet (GO-3 wiring), so this flag only proves the legacy hook can be
# cleanly disabled without breaking the rest of the chart's rendering.
migration:
