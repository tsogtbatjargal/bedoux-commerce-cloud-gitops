apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: bedoux
data:
  # No secret here — just the in-cluster DNS name of the api Service. Contrast with
  # postgres-credentials above, which holds the same shape of "connection info" but
  # embeds a password and is a Secret instead.
  API_UPSTREAM: api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bedoux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: localhost/bedoux-web:p3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-config
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bedoux
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
  # NodePort is a P3.1-only stopgap for manual verification. Real routing (/ and /api
  # both through one entrypoint) arrives as Ingress in P3.3.
