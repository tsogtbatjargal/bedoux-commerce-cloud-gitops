# Local-dev-only credentials, identical to docker-compose.yml's postgres service — never a
# production secret. Real credentials return via AWS Secrets Manager in P7 (ADR 0002).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: bedoux
type: Opaque
stringData:
  POSTGRES_USER: bedoux
  POSTGRES_PASSWORD: bedoux
  POSTGRES_DB: bedoux
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: bedoux
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bedoux
spec:
  replicas: 1
  # In-cluster Postgres is the MVP profile (ADR 0002); a single replica with a PVC is
  # sufficient here since RDS takes over durability/HA concerns in the production profile.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Subdirectory, not the volume mount root — postgres refuses to initdb into a
            # non-empty directory, and some CSI/local-path provisioners pre-populate the
            # mount root (e.g. lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bedoux
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
