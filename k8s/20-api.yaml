apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bedoux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: localhost/bedoux-api:p3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: BEDOUX_DATABASE_URL
              value: postgresql+psycopg://bedoux:bedoux@postgres:5432/bedoux
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bedoux
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
