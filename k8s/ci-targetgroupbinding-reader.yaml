# P13.1: AmazonEKSEditPolicy does not include controller custom resources.
# The GitHub Actions access entry joins only this group; session bootstrap applies
# this namespace-scoped read role after creating namespace/bedoux.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedoux-ci-targetgroupbinding-reader
  namespace: bedoux
rules:
  - apiGroups: ["elbv2.k8s.aws"]
    resources: ["targetgroupbindings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedoux-ci-targetgroupbinding-reader
  namespace: bedoux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedoux-ci-targetgroupbinding-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: bedoux-ci-targetgroupbinding-reader
