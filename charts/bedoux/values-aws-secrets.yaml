# P7.3 AWS-session overlay. The API, migration, and seed Pods use this
# ServiceAccount's IRSA role to fetch the JSON DATABASE_URL from Secrets Manager.
# The secret name is an identifier, not a credential; its value is never rendered
# into Helm output or a Kubernetes Secret.
api:
  serviceAccount:
    create: false
    name: bedoux-api-secrets

database:
  credentialSource: secrets-manager
  secretManager:
    name: bedoux-rds-credentials
    region: ca-central-1
