{{- if and .Values.ingress.tls.enabled (ne .Values.ingress.controller "alb") }}
{{- fail "ingress.tls.enabled is supported only by the AWS ALB profile" }}
{{- end }}
{{- if and .Values.ingress.tls.enabled (empty .Values.ingress.hosts) }}
{{- fail "ingress.tls.enabled requires at least one certificate-discovery host" }}
{{- end }}
{{- if eq .Values.ingress.controller "alb" }}
# Single ALB Ingress — ALB has no path-rewrite annotation equivalent to nginx's
# rewrite-target, so /api can't be prefix-stripped at the Ingress layer here.
# Everything routes to web; the web container's own nginx reverse proxy
# (apps/web/nginx.conf.template) forwards /api/ to the api Service internally,
# stripping the prefix — logic that already existed for Compose and sat
# dormant in the kind/nginx-Ingress profile. See ADR 0008.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bedoux
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: bedoux
    {{- if .Values.ingress.tls.enabled }}
    # The controller discovers the already-issued ACM certificate from these
    # Ingress hosts; no account-bearing certificate ARN belongs in chart values.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    {{- with .Values.ingress.targetGroupDeregistrationDelaySeconds }}
    alb.ingress.kubernetes.io/target-group-attributes: {{ printf "deregistration_delay.timeout_seconds=%v" . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ . | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hosts }}
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
    {{- end }}
    {{- else }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
    {{- end }}
{{- else }}
# Two Ingress objects, not one — nginx.ingress.kubernetes.io/rewrite-target applies to
# the whole Ingress resource, not per-path, and only /api needs its prefix stripped.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bedoux-api
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bedoux-web
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
{{- end }}
