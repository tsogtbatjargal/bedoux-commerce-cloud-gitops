apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Blocks startup until either the in-cluster database or P7 external RDS
      # accepts the single credential URL consumed by the API.
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          command:
            - python
            - -c
            - |
              import os
              import time
              from sqlalchemy import create_engine, text
              engine = create_engine(os.environ["BEDOUX_DATABASE_URL"], pool_pre_ping=True)
              while True:
                  try:
                      with engine.connect() as connection:
                          connection.execute(text("SELECT 1"))
                      break
                  except Exception:
                      time.sleep(1)
          env:
            - name: BEDOUX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bedoux.databaseCredentialsSecretName" . }}
                  key: {{ include "bedoux.databaseCredentialsSecretKey" . }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: BEDOUX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bedoux.databaseCredentialsSecretName" . }}
                  key: {{ include "bedoux.databaseCredentialsSecretKey" . }}
            # Kill switch (ADR-pending decision #4, docs/IMPLEMENTATION-PLAN.md):
            # off by default in the AWS session values overlay.
            - name: BEDOUX_ORDERS_ENABLED
              value: {{ .Values.api.ordersEnabled | quote }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # /health deliberately never touches the database (see apps/api/app/main.py)
          # — DB reachability is guaranteed at startup by the init container above.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
