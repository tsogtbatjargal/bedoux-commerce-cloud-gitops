apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      # Blocks startup until the configured database credential boundary resolves
      # and the database accepts the URL consumed by the API.
      initContainers:
        - name: wait-for-postgres
          image: {{ include "bedoux.imageReference" .Values.api.image | quote }}
          command:
            - python
            - -c
            - |
              import time
              from sqlalchemy import create_engine, text
              from app.database_credentials import resolve_database_url
              engine = create_engine(resolve_database_url(), pool_pre_ping=True)
              while True:
                  try:
                      with engine.connect() as connection:
                          connection.execute(text("SELECT 1"))
                      break
                  except Exception:
                      time.sleep(1)
          env:
            {{- include "bedoux.databaseCredentialEnv" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "bedoux.imageReference" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- include "bedoux.databaseCredentialEnv" . | nindent 12 }}
            # Kill switch (ADR-pending decision #4, docs/IMPLEMENTATION-PLAN.md):
            # off by default in the AWS session values overlay.
            - name: BEDOUX_ORDERS_ENABLED
              value: {{ .Values.api.ordersEnabled | quote }}
            - name: BEDOUX_IMAGE_STORAGE_MODE
              value: {{ .Values.api.imageStorage.mode | quote }}
            - name: BEDOUX_S3_PRESIGN_EXPIRES_SECONDS
              value: {{ .Values.api.imageStorage.presignExpiresSeconds | quote }}
            {{- if eq .Values.api.imageStorage.mode "s3" }}
            - name: BEDOUX_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ required "api.imageStorage.s3ConfigMapName is required in s3 mode" .Values.api.imageStorage.s3ConfigMapName }}
                  key: {{ .Values.api.imageStorage.s3BucketKey }}
            - name: BEDOUX_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.api.imageStorage.s3ConfigMapName }}
                  key: {{ .Values.api.imageStorage.s3RegionKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # /health deliberately never touches the database (see apps/api/app/main.py)
          # — DB reachability is guaranteed at startup by the init container above.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
