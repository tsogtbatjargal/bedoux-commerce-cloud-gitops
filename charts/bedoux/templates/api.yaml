apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- include "bedoux.apiPodSpec" (dict "ctx" . "app" "api" "image" .Values.api.image) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
