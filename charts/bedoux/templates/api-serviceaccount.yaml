{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name }}
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
  annotations:
    # Argo-CD-only metadata, inert to `helm install`/`helm upgrade` (Helm does not
    # interpret argocd.argoproj.io/* annotations at all). Found live 2026-09-10
    # (GO-MVP demo): Argo's Helm-hook translation runs a Job annotated
    # `post-install,pre-upgrade` as a PreSync hook even on a first-ever sync (Argo
    # has no install-vs-upgrade distinction the way Helm does), so the migration
    # Job in migration-job.yaml previously failed on a fresh Argo sync with
    # "serviceaccount bedoux-api not found" — this ServiceAccount is a plain,
    # non-hook resource and did not exist yet. Wave -1 fixes that ordering for the
    # Argo path only; the legacy Helm CLI path ignores this annotation entirely.
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
