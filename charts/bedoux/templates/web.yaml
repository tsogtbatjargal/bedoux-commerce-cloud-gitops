apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
data:
  # No secret here — just the in-cluster DNS name of the api Service.
  API_UPSTREAM: api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      {{- include "bedoux.webPodSpec" (dict "ctx" . "app" "web" "image" .Values.web.image "configMap" "web-config" "command" .Values.web.command) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
