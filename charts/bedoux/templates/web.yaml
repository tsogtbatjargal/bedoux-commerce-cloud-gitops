apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
data:
  # No secret here — just the in-cluster DNS name of the api Service.
  API_UPSTREAM: api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      {{- if .Values.web.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.web.topologySpread.maxSkew }}
          {{- if eq .Values.web.topologySpread.whenUnsatisfiable "DoNotSchedule" }}
          minDomains: {{ .Values.web.topologySpread.minDomains }}
          {{- end }}
          topologyKey: {{ .Values.web.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.web.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: web
      {{- end }}
      containers:
        - name: web
          image: {{ include "bedoux.imageReference" .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- with .Values.web.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-config
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
