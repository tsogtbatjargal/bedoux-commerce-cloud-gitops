{{- if .Values.canary.enabled }}
{{- $weight := int .Values.canary.weight }}
{{- $regressionMode := .Values.canary.regressionMode | default "none" }}
{{- if or (lt $weight 0) (gt $weight 50) }}
{{- fail "canary.weight must be between 0 and 50" }}
{{- end }}
{{- if not (has $regressionMode (list "none" "http-error")) }}
{{- fail "canary.regressionMode must be none or http-error" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.canary.replicas }}
  selector:
    matchLabels:
      app: api-canary
  template:
    metadata:
      labels:
        app: api-canary
    spec:
      {{- include "bedoux.apiPodSpec" (dict "ctx" . "app" "api-canary" "image" .Values.canary.api.image) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: api-canary
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-canary-config
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
data:
  {{- if eq $regressionMode "http-error" }}
  # Keep nginx and its root readiness probe healthy while making only canary
  # /api requests fail against a deliberately absent API route. ADR 0023's
  # existing health gate must catch this before promotion.
  API_UPSTREAM: api-canary:8000/__p13-regression
  {{- else }}
  API_UPSTREAM: api-canary:8000
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.canary.replicas }}
  selector:
    matchLabels:
      app: web-canary
  template:
    metadata:
      labels:
        app: web-canary
    spec:
      {{- include "bedoux.webPodSpec" (dict "ctx" . "app" "web-canary" "image" .Values.canary.web.image "configMap" "web-canary-config" "command" .Values.canary.web.command) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: web-canary
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
