{{- if .Values.canary.enabled }}
{{- $weight := int .Values.canary.weight }}
{{- $regressionMode := .Values.canary.regressionMode | default "none" }}
{{- if or (lt $weight 0) (gt $weight 50) }}
{{- fail "canary.weight must be between 0 and 50" }}
{{- end }}
{{- if not (has $regressionMode (list "none" "http-error")) }}
{{- fail "canary.regressionMode must be none or http-error" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.canary.replicas }}
  selector:
    matchLabels:
      app: api-canary
  template:
    metadata:
      labels:
        app: api-canary
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      terminationGracePeriodSeconds: {{ .Values.api.termination.gracePeriodSeconds }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "bedoux.imageReference" .Values.canary.api.image | quote }}
          command:
            - python
            - -c
            - |
              import time
              from sqlalchemy import create_engine, text
              from app.database_credentials import resolve_database_url
              engine = create_engine(resolve_database_url(), pool_pre_ping=True)
              while True:
                  try:
                      with engine.connect() as connection:
                          connection.execute(text("SELECT 1"))
                      break
                  except Exception:
                      time.sleep(1)
          env:
            {{- include "bedoux.databaseCredentialEnv" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "bedoux.imageReference" .Values.canary.api.image | quote }}
          imagePullPolicy: {{ .Values.canary.api.image.pullPolicy }}
          {{- if gt (int .Values.api.termination.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - {{ printf "sleep %d" (int .Values.api.termination.preStopSleepSeconds) | quote }}
          {{- end }}
          ports:
            - containerPort: 8000
          env:
            {{- include "bedoux.databaseCredentialEnv" . | nindent 12 }}
            - name: BEDOUX_ORDERS_ENABLED
              value: {{ .Values.api.ordersEnabled | quote }}
            - name: BEDOUX_IMAGE_STORAGE_MODE
              value: {{ .Values.api.imageStorage.mode | quote }}
            - name: BEDOUX_S3_PRESIGN_EXPIRES_SECONDS
              value: {{ .Values.api.imageStorage.presignExpiresSeconds | quote }}
            {{- if eq .Values.api.imageStorage.mode "s3" }}
            - name: BEDOUX_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ required "api.imageStorage.s3ConfigMapName is required in s3 mode" .Values.api.imageStorage.s3ConfigMapName }}
                  key: {{ .Values.api.imageStorage.s3BucketKey }}
            - name: BEDOUX_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.api.imageStorage.s3ConfigMapName }}
                  key: {{ .Values.api.imageStorage.s3RegionKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: api-canary
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-canary-config
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
data:
  {{- if eq $regressionMode "http-error" }}
  # Keep nginx and its root readiness probe healthy while making only canary
  # /api requests fail against a deliberately absent API route. ADR 0023's
  # existing health gate must catch this before promotion.
  API_UPSTREAM: api-canary:8000/__p13-regression
  {{- else }}
  API_UPSTREAM: api-canary:8000
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.canary.replicas }}
  selector:
    matchLabels:
      app: web-canary
  template:
    metadata:
      labels:
        app: web-canary
    spec:
      terminationGracePeriodSeconds: {{ .Values.web.termination.gracePeriodSeconds }}
      containers:
        - name: web
          image: {{ include "bedoux.imageReference" .Values.canary.web.image | quote }}
          imagePullPolicy: {{ .Values.canary.web.image.pullPolicy }}
          {{- if gt (int .Values.web.termination.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - {{ printf "sleep %d" (int .Values.web.termination.preStopSleepSeconds) | quote }}
          {{- end }}
          {{- with .Values.canary.web.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-canary-config
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
spec:
  selector:
    app: web-canary
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
