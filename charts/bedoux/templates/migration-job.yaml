{{- if .Values.migration.enabled }}
# Per ADR 0005 (docs/decisions/0005-helm-migration-hook-job.md): runs alembic upgrade
# head so the chart is independently deployable — no manual `kubectl exec` step
# required. Fails the release if migration fails (Helm's default behavior for a failed
# hook Job). Never fires on `helm rollback` — verified live, not assumed — so there is
# deliberately no downgrade counterpart to this Job.
#
# post-install (not pre-install), pre-upgrade: a pre-install hook runs BEFORE any of
# the chart's own non-hook resources exist — verified live, this chart's first attempt
# used pre-install,pre-upgrade and failed on a genuinely fresh install because the
# database credentials Secret this Job depends on didn't exist yet. post-install fires
# after install-time resources are created (this Job's own wait-for-postgres init
# container still handles postgres not being Ready yet, same pattern as api's).
# pre-upgrade still fires before an existing release's resources are upgraded, which is
# what schema-before-rollout requires.
{{- /*
GO-MVP finding, live-reproduced 2026-09-10: Argo CD's Helm-hook-to-Argo-hook
translation maps `pre-upgrade` to PreSync UNCONDITIONALLY — Argo has no
install-vs-upgrade distinction the way Helm does, so a Job annotated
`post-install,pre-upgrade` runs as a PreSync hook even on a FIRST-EVER sync,
before any of the chart's own plain resources (this Job's own ServiceAccount,
Postgres, its credentials Secret) exist. Reproduced live: the Job failed with
"serviceaccount bedoux-api not found", then "Job was active longer than
specified deadline". This is the exact failure ADR 0005's own header comment
already describes for pre-install — Argo's pre-upgrade mapping reproduces it via
a different path. `migration.gitopsMode` (default false, so the legacy Helm CLI
path is completely unchanged) switches this Job to a plain, non-hook,
sync-wave-ordered resource instead, matching the wave design in
docs/gitops-fixtures/gitops-migration-job.example.yaml (wave -1: Postgres/Secret/
ServiceAccount, annotated in postgres.yaml/api-serviceaccount.yaml; wave 0: this
Job, gated by Argo's built-in Job health check before wave 1's api/web apply).

Corrected per Codex's GO-MVP review (docs/PROGRESS.md session log
2026-09-09T20:27:22-06:00, DEF-012): a Job's pod template is immutable, and
`argocd.argoproj.io/sync-options: Replace=true` does NOT reliably make Argo
delete-and-recreate on an immutable-field diff — `Replace=true` only swaps
`kubectl apply` for `kubectl replace`/`create`, which still fails the same way a
plain PUT would on an immutable field (see
https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/, which
documents `Replace=true` and delete-then-create as separate concerns). Fixed by
keying the Job's name on the image tag instead of a fixed name: each real update
changes `api.image.tag` (this MVP's per-run pin), so each update targets a
genuinely NEW Job object — no in-place mutation of an existing Job is ever
attempted, so no sync-option workaround is needed at all. A prior tag's Job is
simply left behind (never auto-deleted, matching this fixture's own "kept around,
not deleted" precedent) until an explicit, reviewed cleanup.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if .Values.migration.gitopsMode }}
  # Argo path: keyed on the image tag (changes every real update in this MVP) so
  # each update always targets a brand-new Job object, never an in-place mutation
  # of an existing one's immutable pod template. Sync-wave "0" as a plain
  # resource — no helm.sh/hook annotation at all under gitopsMode.
  name: bedoux-migrate-gitops-{{ .Values.api.image.tag | lower | trunc 40 | trimSuffix "-" }}
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  {{- else }}
  # Legacy Helm CLI path (ADR 0005), completely unchanged: unique per release
  # revision so hook-delete-policy has something to delete before creating the
  # next one, and so a failed Job's logs from THIS revision aren't immediately
  # overwritten if a retry happens before the delete fires.
  name: bedoux-migrate-{{ .Release.Revision }}
  labels:
    {{- include "bedoux.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    # Delete the PREVIOUS hook Job right before creating this one — not
    # hook-succeeded — so the completed Job stays inspectable until the next release.
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
  {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "bedoux.labels" . | nindent 8 }}
        app: bedoux-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "bedoux.migrationImageReference" . | quote }}
          command:
            - python
            - -c
            - |
              import time
              from sqlalchemy import create_engine, text
              from app.database_credentials import resolve_database_url
              engine = create_engine(resolve_database_url(), pool_pre_ping=True)
              while True:
                  try:
                      with engine.connect() as connection:
                          connection.execute(text("SELECT 1"))
                      break
                  except Exception:
                      time.sleep(1)
          env:
            {{- include "bedoux.databaseCredentialEnv" . | nindent 12 }}
      containers:
        - name: migrate
          image: {{ include "bedoux.migrationImageReference" . | quote }}
          imagePullPolicy: {{ ternary .Values.canary.api.image.pullPolicy .Values.api.image.pullPolicy .Values.canary.enabled }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            {{- include "bedoux.databaseCredentialEnv" . | nindent 12 }}
{{- end }}
