# Local-dev-only defaults throughout this file — see postgres.password below. Real
# deployments override every value here per environment (kind/AWS session use
# different -f values files or --set flags); nothing here is a production default.

api:
  image:
    repository: localhost/bedoux-api
    tag: p3
    # Empty keeps local repository:tag behavior. CI supplies a verified sha256 digest.
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  autoscaling:
    # P11.1 opts this in through values-kind-hpa.yaml. Keep the base chart
    # profile unchanged until a profile explicitly enables bounded scaling.
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpread:
    enabled: false
    maxSkew: 1
    minDomains: 2
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  termination:
    # Disabled by default. The bounded AWS HA profile opts into an explicit
    # target/endpoint-draining window for the P11.4 node-loss drill.
    preStopSleepSeconds: 0
    gracePeriodSeconds: 30
  # On everywhere by default (kind/local demos need working checkout); the AWS
  # session profile overrides this to "false" via values-aws.yaml — see
  # docs/IMPLEMENTATION-PLAN.md's pending decision #4.
  ordersEnabled: true
  serviceAccount:
    # The default local/kind ServiceAccount has no AWS permissions. P7.2's AWS
    # overlay uses an operator-created ServiceAccount with a temporary IRSA
    # annotation instead, so a CI Helm upgrade cannot remove that annotation.
    create: true
    name: bedoux-api
  imageStorage:
    # ADR 0011: the frontend only receives image_url. Static is local/default;
    # the P7.2 overlay switches the API to presigned S3 URLs via IRSA.
    mode: static
    s3ConfigMapName: ""
    s3BucketKey: BEDOUX_S3_BUCKET
    s3RegionKey: BEDOUX_S3_REGION
    presignExpiresSeconds: 900
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

web:
  image:
    repository: localhost/bedoux-web
    tag: p3
    # Empty keeps local repository:tag behavior. CI supplies a verified sha256 digest.
    digest: ""
    pullPolicy: IfNotPresent
  # Test-only rollback drills may override this while retaining a signed image digest.
  command: []
  replicas: 1
  autoscaling:
    # P11.1 opts this in through values-kind-hpa.yaml.
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpread:
    enabled: false
    maxSkew: 1
    minDomains: 2
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  termination:
    preStopSleepSeconds: 0
    gracePeriodSeconds: 30
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgres:
  image:
    repository: docker.io/library/postgres
    tag: 16-alpine
  replicas: 1
  # Local-dev-only credential, identical to docker-compose.yml and the k8s/ plain
  # manifests it replaces — never a production secret. Real credentials return via AWS
  # Secrets Manager in P7 (ADR 0002).
  user: bedoux
  password: bedoux
  database: bedoux
  storage: 1Gi
  # Empty = cluster default StorageClass (kind's local-path). The AWS session
  # profile overrides this to "gp3" via values-aws.yaml — see ADR 0006.
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# The in-cluster database remains the default for Compose/kind/P6. P7.1 switches
# this to external and supplies a pre-created Kubernetes Secret containing only
# DATABASE_URL; P7.3's AWS overlay selects direct Secrets Manager retrieval.
database:
  mode: in-cluster
  credentialSource: kubernetes-secret
  credentialsSecret:
    name: postgres-credentials
    key: DATABASE_URL
  secretManager:
    name: ""
    region: ca-central-1

# Per ADR 0005: fail-fast migration hook, no automatic downgrade on rollback (helm
# rollback doesn't re-fire pre-upgrade hooks at all, verified live — nothing to
# configure for that here).
migration:
  backoffLimit: 2
  activeDeadlineSeconds: 120

# Per ADR 0005: off by default everywhere, including the learning AWS profile. Turn on
# explicitly (--set seed.enabled=true) only to bootstrap a fresh environment — never
# wired on by default where it could re-run against a database with real order data.
seed:
  enabled: false

ingress:
  className: nginx
  # "nginx" (kind) emits the two-Ingress nginx.ingress.kubernetes.io/rewrite-target
  # pattern. "alb" (AWS session profile, values-aws.yaml) emits a single ALB
  # Ingress routing "/" to web only — ALB has no path-rewrite annotation, so
  # /api prefix-stripping happens via the web container's own nginx reverse
  # proxy (apps/web/nginx.conf.template's dormant-in-kind /api/ location block)
  # instead. See ADR 0008.
  controller: nginx
  # Empty preserves the host-agnostic local/AWS session Ingress. P12's TLS
  # overlay fixes these to the two names covered by ADR 0022's certificate.
  hosts: []
  tls:
    enabled: false
  # Empty keeps the cloud-provider default. The AWS HA overlay bounds this so
  # its pod preStop hold can outlive target deregistration.
  targetGroupDeregistrationDelaySeconds: ""

# Per ADR 0006: only the AWS session profile creates this (values-aws.yaml).
# kind has no ebs.csi.aws.com provisioner to satisfy it.
storageClass:
  create: false

# P10.2: default-deny NetworkPolicy + explicit allows (web->api, api/migrate/seed->
# postgres, ingress-controller->web/api, DNS egress). Requires a CNI that actually
# enforces NetworkPolicy -- kindnet (kind's default CNI) silently ignores these
# objects, so kind clusters using this must disable the default CNI and install one
# that enforces it (Calico; see docs/local-tooling.md). Off by default so existing
# AWS/kind usage is unaffected until explicitly enabled and proven.
networkPolicy:
  enabled: false
  # Matches the namespace ingress traffic is allowed in from. kind's ingress-nginx
  # guide creates an "ingress-nginx" namespace, so this default is kind-only -- the
  # AWS ALB profile doesn't route through an in-cluster namespace at all (ALB
  # target-type ip sends traffic to pod IPs from outside the pod network), so this
  # selector needs its own review before P10.5's live AWS drill.
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
