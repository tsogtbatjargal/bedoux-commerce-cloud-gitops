# P11.2 EKS session overlay. Apply only with values-aws.yaml during the
# owner-approved, same-day AWS session; the profile fixes two Spot nodes across
# two AZ-pinned managed node groups.
api:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    # Kubernetes permits minDomains only with DoNotSchedule. Soft spread still
    # prefers both available AZs and permits one-AZ recovery during P11.4.
    whenUnsatisfiable: ScheduleAnyway

web:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
